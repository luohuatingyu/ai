<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>凭证管理 · 可视化模型训练平台</title>
<link rel="stylesheet" href="/app.css?v=20261029-management">
<script src="/remote-management.js?v=20261029-management" defer></script>
</head>
<body class="training-page management-page" data-management-page="credentials">
<header class="topbar"><div class="brand">可视化模型训练平台</div><nav class="app-nav" aria-label="主导航">
    <a href="/">训练工作台</a>
    <a href="/dataset-manager.html">数据集管理</a>
    <a href="/server-manager.html">服务器管理</a>
    <a href="/credential-manager.html" aria-current="page">凭证管理</a>
</nav></header>
<main class="management-shell">

<div class="management-heading"><div><p class="management-eyebrow">SSH 访问凭证</p><h1>凭证管理</h1><p class="hint">统一维护服务器使用的登录凭证。已保存的密码、私钥和口令不会回显。</p></div><button id="btnRefreshCredentials">刷新列表</button></div>
<div id="remoteSshSettingsStatus" class="management-status" role="status" aria-live="polite">正在读取凭证目录…</div>
<div class="credential-workspace">
<section class="management-panel" aria-labelledby="credentialListTitle"><div class="management-panel-heading"><h2 id="credentialListTitle">已保存凭证</h2><button id="btnNewCredential">＋ 新增凭证</button></div><div id="remoteSshCredentialList" class="ssh-credential-list"></div></section>
<section class="management-panel" id="credentialEditor" aria-labelledby="credentialEditorTitle"><h2 id="credentialEditorTitle" tabindex="-1">新增凭证</h2><p class="hint">服务器通过凭证名称选择认证信息，可供多台服务器复用。</p>
<form id="remoteSshCredentialForm" class="ssh-credential-grid" style="margin-top:10px;" novalidate>
        <input id="remoteSshCredentialId" type="hidden">
        <div class="field">
          <label for="remoteSshCredentialName">凭证名称</label>
          <input id="remoteSshCredentialName" maxlength="80" required placeholder="例如：生产 GPU 用户">
        </div>
        <div class="field">
          <label for="remoteSshCredentialUsername">凭证用户名</label>
          <input id="remoteSshCredentialUsername" maxlength="32" pattern="[A-Za-z_][A-Za-z0-9_-]*" required placeholder="SSH 登录用户名">
        </div>
        <div class="field wide">
          <label for="remoteSshAuthMethod">认证组合</label>
          <select id="remoteSshAuthMethod">
            <option value="password">用户名 + 密码</option>
            <option value="key">用户名 + 密钥</option>
            <option value="key_password">用户名 + 密钥 + 密码（先尝试密钥）</option>
          </select>
        </div>
        <div class="field wide" id="remoteSshKeyFields" hidden>
          <label for="remoteSshPrivateKey">私钥内容</label>
          <textarea id="remoteSshPrivateKey" autocomplete="off" spellcheck="false" placeholder="粘贴完整的 OpenSSH / PEM 私钥；支持 OpenSSH 可识别的密钥类型"></textarea>
          <div class="hint">支持 OpenSSH 可识别的 Ed25519、ECDSA、RSA 等格式。保存或编辑时不会回显私钥。</div>
        </div>
        <div class="field wide" id="remoteSshPassphraseField" hidden>
          <label for="remoteSshPassphrase">私钥口令（可选）</label>
          <input id="remoteSshPassphrase" type="password" autocomplete="new-password">
        </div>
        <div class="field wide" id="remoteSshPasswordField" hidden>
          <label for="remoteSshPassword">SSH 登录密码</label>
          <input id="remoteSshPassword" type="password" autocomplete="new-password">
        </div>
        <label class="field wide"><span><input id="remoteSshMakeDefault" type="checkbox"> 设为默认凭证</span></label>
        <div class="ssh-credential-actions field wide">
          <button type="submit" id="btnSaveRemoteSshSettings" class="primary">加密保存凭证</button>
          <button type="button" id="btnCancelEditRemoteSshCredential">重置</button>
        </div>
      </form>
<div id="credentialFormError" class="server-form-error" role="alert" hidden></div>
</section></div>

</main>

<div id="toastWrap" aria-live="polite"></div>
</body>
</html>
