<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数据集管理 · 可视化模型训练平台</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="dataset-page">
    <header class="topbar">
        <div class="brand">可视化模型训练平台<span class="muted"> · 数据集</span></div>
        <nav class="app-nav" aria-label="主导航">
            <a href="/">训练工作台</a>
            <a href="/dataset-manager.html" aria-current="page">数据集管理</a>
        </nav>
    </header>

    <main class="page-shell">
        <div class="page-heading">
            <div>
                <h1>数据集管理</h1>
                <p>导入、查找和整理用于训练的数据集。</p>
            </div>
            <span class="tag" id="datasetCount">0 个数据集</span>
        </div>

        <section class="section-card" aria-labelledby="uploadTitle">
            <h2 class="section-title" id="uploadTitle">导入数据集</h2>
            <p class="section-description">支持 CSV、Excel、JSON，以及包含这些文件的 ZIP、TAR、TAR.GZ 压缩包；可一次选择多个文件。</p>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon" aria-hidden="true">📁</div>
                <div class="upload-text">将文件拖到此处，或从电脑中选择</div>
                <div class="upload-hint">文件将在本地训练平台中处理</div>
                <input type="file" id="fileInput" class="file-input" multiple accept=".csv,.xlsx,.xls,.json,.zip,.tar,.tar.gz,.tgz">
                <button type="button" class="btn-primary" id="selectFilesBtn">选择文件</button>
            </div>
            <div class="upload-progress" id="uploadProgress" hidden>
                <span class="loading" aria-hidden="true"></span>
                <span id="uploadStatus" role="status" aria-live="polite">准备上传…</span>
            </div>
        </section>

        <section class="section-card" aria-labelledby="datasetTitle">
            <h2 class="section-title" id="datasetTitle">数据集列表</h2>
            <p class="section-description">查看数据规模、字段和标签；可按名称、描述、字段或标签筛选。</p>
            <div class="filter-bar">
                <input type="search" class="search-input" id="searchInput" placeholder="搜索数据集、描述或字段…" aria-label="搜索数据集">
                <div class="tag-filter" id="tagFilter" aria-label="按标签筛选"></div>
            </div>
            <div class="dataset-grid" id="datasetGrid" aria-live="polite">
                <div class="empty-state">正在加载数据集…</div>
            </div>
        </section>
    </main>

    <div class="modal" id="datasetModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">数据集详情</h2>
                <button type="button" class="close-btn" data-close-modal="datasetModal" aria-label="关闭详情">×</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="modal" id="processingModal" role="dialog" aria-modal="true" aria-labelledby="processingTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="processingTitle">数据处理</h2>
                <button type="button" class="close-btn" data-close-modal="processingModal" aria-label="关闭处理窗口">×</button>
            </div>
            <p class="section-description">处理结果保存为数据集的处理版本，原始文件保留。参数使用 JSON 对象，例如 {"strategy":"median"}。</p>
            <div id="processingBody"></div>
        </div>
    </div>

    <script>
        "use strict";

        const API_BASE = "/api";
        const $ = (id) => document.getElementById(id);
        let datasets = [];
        let allTags = [];
        let selectedTags = [];
        let activeDatasetId = null;
        let availableOperations = [];
        let queuedOperations = [];

        // 初始化页面事件并加载列表、标签。
        document.addEventListener("DOMContentLoaded", () => {
            initializeUpload();
            $("searchInput").addEventListener("input", filterDatasets);
            $("datasetGrid").addEventListener("click", handleDatasetAction);
            $("processingBody").addEventListener("click", handleProcessingAction);
            document.querySelectorAll("[data-close-modal]").forEach((button) => {
                button.addEventListener("click", () => closeModal(button.dataset.closeModal));
            });
            document.querySelectorAll(".modal").forEach((modal) => {
                modal.addEventListener("click", (event) => {
                    if (event.target === modal) closeModal(modal.id);
                });
            });
            document.addEventListener("keydown", (event) => {
                if (event.key === "Escape") {
                    document.querySelectorAll(".modal.is-open").forEach((modal) => closeModal(modal.id));
                }
            });
            loadDatasets();
            loadTags();
        });

        // 初始化文件选择与拖拽上传事件。
        function initializeUpload() {
            const area = $("uploadArea");
            const input = $("fileInput");
            $("selectFilesBtn").addEventListener("click", () => input.click());
            area.addEventListener("dragover", (event) => {
                event.preventDefault();
                area.classList.add("drag-over");
            });
            area.addEventListener("dragleave", (event) => {
                event.preventDefault();
                if (!area.contains(event.relatedTarget)) area.classList.remove("drag-over");
            });
            area.addEventListener("drop", (event) => {
                event.preventDefault();
                area.classList.remove("drag-over");
                handleFiles(event.dataTransfer.files);
            });
            input.addEventListener("change", () => {
                handleFiles(input.files);
                input.value = "";
            });
        }

        // 把动态文本转义为 HTML 文本，避免数据集内容被浏览器解释为标签。
        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, (character) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "\"": "&quot;",
                "'": "&#39;"
            })[character]);
        }

        // 请求 JSON API，并将服务端错误转换为可读异常。
        async function apiJson(url, options) {
            const response = await fetch(url, options || {});
            let body = {};
            try {
                body = await response.json();
            } catch (_error) {
                body = {};
            }
            if (!response.ok) {
                throw new Error(body.detail || "请求失败（HTTP " + response.status + "）");
            }
            return body;
        }

        // 上传所选文件并逐个反馈成功或失败状态。
        async function handleFiles(fileList) {
            const files = Array.from(fileList || []);
            if (!files.length) return;

            const progress = $("uploadProgress");
            const status = $("uploadStatus");
            const selectButton = $("selectFilesBtn");
            const results = [];
            progress.hidden = false;
            selectButton.disabled = true;

            for (let index = 0; index < files.length; index += 1) {
                const file = files[index];
                status.textContent = "正在上传 " + (index + 1) + "/" + files.length + "：" + file.name;
                try {
                    const result = await uploadFile(file);
                    const imported = Array.isArray(result.datasets) ? result.datasets : [result];
                    results.push({ file: file.name, success: true, count: imported.length });
                } catch (error) {
                    results.push({ file: file.name, success: false, error: error.message });
                }
            }

            progress.hidden = true;
            selectButton.disabled = false;
            const successCount = results.filter((result) => result.success).length;
            let message = "导入完成：" + successCount + "/" + files.length + " 个文件成功";
            results.filter((result) => result.success).forEach((result) => {
                if (result.count > 1) message += "\n" + result.file + "：导入 " + result.count + " 个数据集";
            });
            results.filter((result) => !result.success).forEach((result) => {
                message += "\n" + result.file + "： " + result.error;
            });
            showNotification(message, successCount === files.length ? "success" : "error");
            await Promise.all([loadDatasets(), loadTags()]);
        }

        // 通过多格式导入接口上传单个文件。
        async function uploadFile(file) {
            const formData = new FormData();
            formData.append("file", file);
            return apiJson(API_BASE + "/datasets/import", { method: "POST", body: formData });
        }

        // 获取数据集列表并更新页面计数。
        async function loadDatasets() {
            try {
                const result = await apiJson(API_BASE + "/datasets");
                datasets = Array.isArray(result.datasets) ? result.datasets : [];
                $("datasetCount").textContent = result.total + " 个数据集";
                filterDatasets();
            } catch (error) {
                showNotification(error.message, "error");
                $("datasetGrid").innerHTML = '<div class="empty-state">数据集加载失败，请稍后重试。</div>';
            }
        }

        // 创建安全转义后的数据集卡片。
        function createDatasetCard(dataset) {
            const columns = Array.isArray(dataset.columns) ? dataset.columns : [];
            const tags = Array.isArray(dataset.tags) ? dataset.tags : [];
            const columnTags = columns.slice(0, 5).map((column) =>
                '<span class="tag">' + escapeHtml(column) + "</span>"
            ).join("");
            const extraColumns = columns.length > 5
                ? '<span class="tag">+' + (columns.length - 5) + " 列</span>"
                : "";
            const card = document.createElement("article");
            card.className = "dataset-card";
            card.innerHTML =
                '<div class="dataset-header">' +
                    '<h3 class="dataset-title">' + escapeHtml(dataset.name || "未命名数据集") + "</h3>" +
                    '<div class="dataset-actions">' +
                        '<button type="button" data-action="detail" data-id="' + escapeHtml(dataset.id) + '">详情</button>' +
                        '<button type="button" class="btn-secondary" data-action="process" data-id="' + escapeHtml(dataset.id) + '">处理</button>' +
                        '<button type="button" class="btn-danger" data-action="delete" data-id="' + escapeHtml(dataset.id) + '">删除</button>' +
                    "</div>" +
                "</div>" +
                '<div class="dataset-info">' +
                    '<span class="dataset-meta">' + Number(dataset.rows || 0).toLocaleString("zh-CN") + " 行 · " + columns.length + " 列</span>" +
                    '<span class="dataset-meta">创建于 ' + escapeHtml(formatDate(dataset.created_at)) + "</span>" +
                    (dataset.description ? '<span class="dataset-meta">' + escapeHtml(dataset.description) + "</span>" : "") +
                "</div>" +
                '<div class="dataset-tags">' + tags.map((tag) =>
                    '<span class="tag">' + escapeHtml(tag) + "</span>"
                ).join("") + columnTags + extraColumns + "</div>";
            return card;
        }

        // 按当前搜索词与标签筛选并绘制数据集卡片。
        function filterDatasets() {
            const searchTerm = $("searchInput").value.trim().toLocaleLowerCase();
            const filtered = datasets.filter((dataset) => {
                const searchable = [
                    dataset.name || "",
                    dataset.description || "",
                    ...(Array.isArray(dataset.columns) ? dataset.columns : [])
                ].join(" ").toLocaleLowerCase();
                const matchesSearch = !searchTerm || searchable.includes(searchTerm);
                const tags = Array.isArray(dataset.tags) ? dataset.tags : [];
                const matchesTags = selectedTags.length === 0 || selectedTags.some((tag) => tags.includes(tag));
                return matchesSearch && matchesTags;
            });

            const grid = $("datasetGrid");
            if (!filtered.length) {
                grid.innerHTML = '<div class="empty-state">' +
                    (datasets.length ? "没有符合条件的数据集。" : "暂无数据集，先从上方导入文件。") +
                    "</div>";
                return;
            }
            grid.replaceChildren(...filtered.map(createDatasetCard));
        }

        // 从卡片操作区分派详情、处理和删除动作。
        function handleDatasetAction(event) {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            const datasetId = button.dataset.id;
            if (button.dataset.action === "detail") showDatasetDetail(datasetId);
            if (button.dataset.action === "process") processDataset(datasetId);
            if (button.dataset.action === "delete") deleteDataset(datasetId);
        }

        // 读取数据集详情并以转义文本展示字段和元信息。
        async function showDatasetDetail(datasetId) {
            try {
                const dataset = await apiJson(API_BASE + "/datasets/" + encodeURIComponent(datasetId));
                $("modalTitle").textContent = dataset.name || "数据集详情";
                const columns = Array.isArray(dataset.columns) ? dataset.columns : [];
                const types = dataset.column_types || {};
                const rows = Array.isArray(dataset.preview) ? dataset.preview : [];
                const table = '<div class="dataset-preview"><table class="preview-table"><thead><tr>' +
                    columns.map((column) => "<th>" + escapeHtml(column) + "</th>").join("") +
                    "</tr></thead><tbody>" + rows.map((row) =>
                        "<tr>" + columns.map((column) =>
                            "<td>" + escapeHtml(row[column] == null ? "" : row[column]) + "</td>"
                        ).join("") + "</tr>"
                    ).join("") + "</tbody></table></div>";
                const columnTypes = columns.map((column) =>
                    "<tr><td>" + escapeHtml(column) + "</td><td>" + escapeHtml(types[column] || "未知") + "</td></tr>"
                ).join("");
                $("modalBody").innerHTML =
                    '<div class="dataset-info">' +
                        '<span class="dataset-meta">ID：' + escapeHtml(dataset.id) + "</span>" +
                        '<span class="dataset-meta">行数：' + Number(dataset.rows || 0).toLocaleString("zh-CN") + "</span>" +
                        '<span class="dataset-meta">文件大小：' + escapeHtml(formatBytes(dataset.file_size)) + "</span>" +
                        '<span class="dataset-meta">创建时间：' + escapeHtml(formatDate(dataset.created_at)) + "</span>" +
                        '<span class="dataset-meta">更新时间：' + escapeHtml(formatDate(dataset.updated_at)) + "</span>" +
                    "</div>" +
                    '<h3 class="modal-section-title">字段类型</h3>' +
                    '<div class="dataset-preview"><table class="preview-table"><thead><tr><th>字段</th><th>类型</th></tr></thead><tbody>' +
                        columnTypes + "</tbody></table></div>" +
                    '<h3 class="modal-section-title">数据预览</h3>' + table +
                    (dataset.description ? '<h3 class="modal-section-title">描述</h3><p>' + escapeHtml(dataset.description) + "</p>" : "") +
                    (Array.isArray(dataset.tags) && dataset.tags.length
                        ? '<h3 class="modal-section-title">标签</h3><div class="dataset-tags">' +
                            dataset.tags.map((tag) => '<span class="tag">' + escapeHtml(tag) + "</span>").join("") +
                          "</div>"
                        : "");
                openModal("datasetModal");
            } catch (error) {
                showNotification(error.message, "error");
            }
        }

        // 获取后端操作定义并打开可配置的处理面板。
        async function processDataset(datasetId) {
            try {
                const result = await apiJson(API_BASE + "/processing/operations");
                activeDatasetId = datasetId;
                availableOperations = Array.isArray(result.operations) ? result.operations : [];
                queuedOperations = [];
                renderProcessingPanel();
                openModal("processingModal");
            } catch (error) {
                showNotification(error.message, "error");
            }
        }

        // 绘制可选处理步骤和当前待执行队列。
        function renderProcessingPanel() {
            const operationCards = availableOperations.map((operation) => {
                const parameterHints = Object.entries(operation.params || {}).map(([name, detail]) =>
                    '<div class="param-label"><strong>' + escapeHtml(name) + "</strong> · " +
                    escapeHtml(detail.description || detail.type || "") + "</div>"
                ).join("");
                return '<article class="operation-item">' +
                    '<div class="operation-header"><div class="operation-title">' + escapeHtml(operation.name) +
                    '</div><button type="button" data-action="queue-operation" data-type="' + escapeHtml(operation.type) +
                    '">加入队列</button></div>' +
                    '<p class="operation-description">' + escapeHtml(operation.description) + "</p>" +
                    '<div class="operation-params">' + parameterHints + "</div>" +
                    "</article>";
            }).join("");
            const queueItems = queuedOperations.map((item, index) =>
                '<div class="queued-operation">' +
                    '<strong>' + escapeHtml(item.name) + "</strong>" +
                    '<textarea aria-label="' + escapeHtml(item.name) + ' 参数 JSON" data-queue-index="' + index +
                    '" spellcheck="false">' + escapeHtml(JSON.stringify(item.params, null, 2)) + "</textarea>" +
                    '<button type="button" class="btn-danger" data-action="remove-operation" data-index="' + index + '">移除</button>' +
                "</div>"
            ).join("");
            $("processingBody").innerHTML =
                '<h3 class="modal-section-title">可用操作</h3>' +
                '<div class="processing-operations">' + operationCards + "</div>" +
                '<h3 class="modal-section-title">执行队列（' + queuedOperations.length + "）</h3>" +
                '<div class="operation-queue" id="operationQueue">' +
                    (queueItems || '<div class="empty-state">先从上方添加一个处理步骤。</div>') +
                "</div>" +
                '<div class="modal-actions">' +
                    '<button type="button" data-action="apply-processing"' + (queuedOperations.length ? "" : " disabled") + '>应用处理</button>' +
                "</div>";
        }

        // 处理新增步骤、移除步骤和提交处理队列的点击事件。
        function handleProcessingAction(event) {
            const button = event.target.closest("button[data-action]");
            if (!button) return;
            if (button.dataset.action === "queue-operation") {
                const type = button.dataset.type;
                const definition = availableOperations.find((operation) => operation.type === type);
                if (!definition) return;
                queuedOperations.push({ type: type, name: definition.name, params: {} });
                renderProcessingPanel();
            } else if (button.dataset.action === "remove-operation") {
                queuedOperations.splice(Number(button.dataset.index), 1);
                renderProcessingPanel();
            } else if (button.dataset.action === "apply-processing") {
                applyProcessing();
            }
        }

        // 校验队列参数 JSON，提交处理请求并刷新数据集状态。
        async function applyProcessing() {
            const operations = [];
            try {
                $("processingBody").querySelectorAll("[data-queue-index]").forEach((field) => {
                    const params = JSON.parse(field.value);
                    if (!params || Array.isArray(params) || typeof params !== "object") {
                        throw new Error("每个处理步骤的参数必须是 JSON 对象。");
                    }
                    operations.push({
                        type: queuedOperations[Number(field.dataset.queueIndex)].type,
                        params: params
                    });
                });
            } catch (error) {
                showNotification("参数格式错误：" + error.message, "error");
                return;
            }

            if (!activeDatasetId || !operations.length) return;
            const submitButton = $("processingBody").querySelector('[data-action="apply-processing"]');
            submitButton.disabled = true;
            try {
                const result = await apiJson(
                    API_BASE + "/datasets/" + encodeURIComponent(activeDatasetId) + "/process",
                    {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ operations: operations })
                    }
                );
                closeModal("processingModal");
                showNotification("处理完成：" + result.original_rows + " 行 → " + result.processed_rows + " 行", "success");
                await loadDatasets();
            } catch (error) {
                submitButton.disabled = false;
                showNotification(error.message, "error");
            }
        }

        // 确认后删除数据集并同步刷新列表和标签。
        async function deleteDataset(datasetId) {
            if (!window.confirm("确定删除这个数据集吗？此操作会删除数据集及其处理结果。")) return;
            try {
                await apiJson(API_BASE + "/datasets/" + encodeURIComponent(datasetId), { method: "DELETE" });
                showNotification("数据集已删除", "success");
                await Promise.all([loadDatasets(), loadTags()]);
            } catch (error) {
                showNotification(error.message, "error");
            }
        }

        // 获取所有标签并渲染筛选按钮。
        async function loadTags() {
            try {
                const result = await apiJson(API_BASE + "/datasets/tags");
                allTags = Array.isArray(result.tags) ? result.tags : [];
                renderTags();
            } catch (error) {
                showNotification(error.message, "error");
            }
        }

        // 使用按钮语义显示标签并维护筛选状态。
        function renderTags() {
            const container = $("tagFilter");
            container.replaceChildren();
            allTags.forEach((tag) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "tag" + (selectedTags.includes(tag) ? " active" : "");
                button.textContent = tag;
                button.setAttribute("aria-pressed", String(selectedTags.includes(tag)));
                button.addEventListener("click", () => toggleTag(tag));
                container.appendChild(button);
            });
        }

        // 切换标签筛选状态并刷新卡片。
        function toggleTag(tag) {
            const index = selectedTags.indexOf(tag);
            if (index >= 0) selectedTags.splice(index, 1);
            else selectedTags.push(tag);
            renderTags();
            filterDatasets();
        }

        // 显示指定的对话框并将键盘焦点放到关闭按钮。
        function openModal(id) {
            const modal = $(id);
            modal.classList.add("is-open");
            const closeButton = modal.querySelector("[data-close-modal]");
            if (closeButton) closeButton.focus();
        }

        // 关闭对话框并清除处理面板上的临时队列。
        function closeModal(id) {
            const modal = $(id);
            if (!modal) return;
            modal.classList.remove("is-open");
            if (id === "processingModal") {
                activeDatasetId = null;
                queuedOperations = [];
            }
        }

        // 创建只使用 textContent 的通知，避免错误消息触发 HTML 解析。
        function showNotification(message, type) {
            const notification = document.createElement("div");
            notification.className = "notification" + (type === "error" ? " error" : "");
            notification.textContent = message;
            notification.setAttribute("role", type === "error" ? "alert" : "status");
            document.body.appendChild(notification);
            window.setTimeout(() => notification.remove(), 4500);
        }

        // 将秒级时间戳格式化为本地日期。
        function formatDate(timestamp) {
            if (!timestamp) return "—";
            const date = new Date(Number(timestamp) * 1000);
            return Number.isNaN(date.getTime()) ? "—" : date.toLocaleString("zh-CN", { hour12: false });
        }

        // 将文件字节数格式化为易读单位。
        function formatBytes(bytes) {
            const value = Number(bytes);
            if (!Number.isFinite(value) || value < 0) return "—";
            if (value === 0) return "0 B";
            const units = ["B", "KB", "MB", "GB"];
            const unitIndex = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1);
            return (value / Math.pow(1024, unitIndex)).toFixed(unitIndex === 0 ? 0 : 2) + " " + units[unitIndex];
        }
    </script>
</body>
</html>
