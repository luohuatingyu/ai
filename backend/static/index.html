<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可视化模型训练平台</title>
<link rel="icon" href="data:,">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2333; --border: #2d333b;
    --text: #e6edf3; --muted: #9fb0c7; --accent: #58a6ff; --ok: #3fb950;
    --danger: #f85149; --warn: #d29922; --chip: #21262d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--chip);
           color: var(--text); border-radius: 8px; padding: 7px 14px; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.danger { color: var(--danger); border-color: transparent; background: rgba(248,85,49,.12); }
  button.danger:hover { border-color: var(--danger); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select, textarea { background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; width: 100%; }
  textarea { font-family: ui-monospace, Menlo, monospace; min-height: 120px; resize: vertical; }
  h2 { font-size: 14px; margin: 18px 0 8px; color: var(--muted);
       text-transform: none; letter-spacing: .3px; }

  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .brand { font-weight: 700; font-size: 16px; }
  .brand .sub { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 10px; }
  .badge { display: inline-flex; gap: 7px; align-items: center; padding: 4px 12px;
    border-radius: 999px; background: var(--chip); border: 1px solid var(--border); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--danger); }

  .layout { display: grid; grid-template-columns: 380px 1fr; gap: 16px;
            padding: 16px 20px; max-width: 1280px; margin: 0 auto; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border);
           border-radius: 12px; padding: 16px; align-self: start; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
  .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 12px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .empty { color: var(--muted); text-align: center; padding: 22px 8px; border: 1px dashed var(--border);
           border-radius: 10px; font-size: 13px; }

  /* 任务卡片 */
  .jobcard { border: 1px solid var(--border); background: var(--panel2); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .jobcard:hover { border-color: var(--accent); }
  .jobcard.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .jobline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .jobname { font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--chip);
          border: 1px solid var(--border); color: var(--muted); }
  .st-queued { color: var(--muted); } .st-running { color: var(--accent); }
  .st-completed { color: var(--ok); } .st-failed { color: var(--danger); }
  .st-cancelled { color: var(--warn); }
  .progress { height: 6px; background: var(--chip); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .progress.done > div { background: var(--ok); }
  .progress.failed > div, .progress.cancelled > div { background: var(--danger); }

  /* 详情区 */
  #detailHead { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  #detailHead .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  .tabs button { border: none; background: transparent; border-bottom: 2px solid transparent;
    border-radius: 8px 8px 0 0; color: var(--muted); padding: 8px 14px; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .chartbox { background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; margin-bottom: 14px; }
  .chartbox h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 500; }
  #logBox { background: #0a0d12; border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; height: 420px; overflow: auto; white-space: pre-wrap;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; }
  .statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
  table.report { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 10px; }
  table.report th, table.report td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; }
  table.report th { background: var(--panel2); color: var(--muted); font-weight: 500; }
  #predictOut { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px; margin-top: 10px; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
    white-space: pre-wrap; }

  /* toast */
  #toastWrap { position: fixed; top: 16px; right: 16px; z-index: 50; display: flex;
    flex-direction: column; gap: 8px; }
  .toast { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 16px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.4); max-width: 340px; }
  .toast.err { border-color: var(--danger); } .toast.ok { border-color: var(--ok); }
  .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .preview-table th, .preview-table td { border: 1px solid var(--border); padding: 4px 8px;
    text-align: left; white-space: nowrap; max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
  .preview-table th { background: var(--panel2); color: var(--muted); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">🏋️ 可视化模型训练平台<span class="sub">Docker · Python 3.12 · PyTorch GPU</span></div>
  <div id="deviceBadge" class="badge"><span class="dot"></span><span id="deviceText">检测训练设备中…</span></div>
</header>

<main class="layout">
  <!-- 左栏：数据集 + 参数 -->
  <aside class="panel">
    <h2>① 数据集</h2>
    <div class="row">
      <select id="datasetSelect"></select>
      <button id="btnUpload">上传 CSV</button>
    </div>
    <input type="file" id="fileInput" accept=".csv" hidden>
    <div id="sampleBox" class="chips" style="margin-bottom:10px;"></div>
    <div id="previewWrap"><div class="empty">选择或上传数据集后在此预览</div></div>
    <div id="previewMeta" class="hint" style="margin-top:6px;"></div>

    <h2>② 训练配置</h2>
    <form id="trainForm" class="stack" onsubmit="return false;">
      <div class="formgrid">
        <div class="field">
          <label>目标列（要预测的列）</label>
          <select id="targetSelect"></select>
        </div>
        <div class="field">
          <label>任务类型</label>
          <select id="taskSelect">
            <option value="classification">分类</option>
            <option value="regression">回归</option>
          </select>
        </div>
        <div class="field"><label>轮数 epochs</label><input id="p_epochs" type="number" value="30" min="1" max="500"></div>
        <div class="field"><label>批大小 batch_size</label><input id="p_batch_size" type="number" value="64" min="1" max="4096"></div>
        <div class="field"><label>学习率 lr</label><input id="p_lr" type="number" value="0.001" step="0.0001" min="0.0001"></div>
        <div class="field"><label>隐藏层数</label><input id="p_hidden_layers" type="number" value="3" min="0" max="8"></div>
        <div class="field"><label>每层神经元</label><input id="p_hidden_size" type="number" value="128" min="1" max="2048"></div>
        <div class="field"><label>验证集比例</label><input id="p_test_split" type="number" value="0.2" step="0.05" min="0.05" max="0.5"></div>
      </div>
      <button id="btnStart" class="primary" disabled>🚀 开始训练</button>
      <div class="hint">提示：目标列为连续数值时请选择「回归」，否则选「分类」。</div>
    </form>
  </aside>

  <!-- 右栏：任务列表 + 详情 -->
  <section class="panel">
    <h2 style="margin-top:0;">③ 训练任务</h2>
    <div id="jobList"><div class="empty">暂无任务，先在左侧发起训练</div></div>

    <div id="detail" hidden>
      <div id="detailHead">
        <div class="jobline"><span id="dName" class="jobname"></span><span id="dStatus" class="chip"></span><span id="dDevice" class="chip"></span></div>
        <div class="actions">
          <button id="btnCancel" hidden>⏹ 取消</button>
          <button id="btnDownload" hidden>⬇ 下载模型</button>
          <button id="btnDelete" class="danger">🗑 删除</button>
        </div>
      </div>
      <div class="progress" id="dProgress"><div></div></div>
      <div id="dProgressText" class="hint" style="margin:4px 0 12px;"></div>

      <div class="tabs">
        <button data-tab="curves" class="active">📈 曲线</button>
        <button data-tab="logs">📜 日志</button>
        <button data-tab="result">🏆 结果</button>
        <button data-tab="predict">🔮 预测</button>
      </div>

      <div id="tab-curves">
        <div class="chartbox"><h3>Loss（训练 / 验证）</h3><canvas id="lossChart" height="150"></canvas></div>
        <div class="chartbox"><h3 id="metricTitle">验证指标</h3><canvas id="metricChart" height="130"></canvas></div>
        <div class="hint" id="chartNote"></div>
      </div>

      <div id="tab-logs" hidden><pre id="logBox"></pre></div>

      <div id="tab-result" hidden><div id="resultBox" class="empty">任务完成后展示评估结果</div></div>

      <div id="tab-predict" hidden>
        <div class="hint" style="margin-bottom:6px;">使用最佳模型进行单条预测（JSON，与数据集列同名字段）：</div>
        <textarea id="predictInput" spellcheck="false"></textarea>
        <div class="row" style="margin-top:8px;"><button id="btnPredict" class="primary">预测</button></div>
        <div id="predictOut" hidden></div>
      </div>
    </div>
  </section>
</main>

<div id="toastWrap"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const state = {
  datasets: [], datasetId: null, preview: null,
  jobs: [], jobId: null, logOffset: 0, activeTab: "curves",
  charts: { loss: null, metric: null }, metricKind: null,
};

/* ---------- 基础工具 ---------- */
async function apiJson(url, opt = {}) {
  const res = await fetch(url, opt);
  let body = null;
  try { body = await res.json(); } catch { /* ignore */ }
  if (!res.ok) throw new Error((body && body.detail) || `HTTP ${res.status}`);
  return body;
}
function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("toastWrap").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
const fmtTime = (ts) => ts ? new Date(ts * 1000).toLocaleString("zh-CN", { hour12: false }) : "-";
const fmtLoss = (v) => (v === null || v === undefined) ? "-" : Number(v).toFixed(4);

/* ---------- 设备徽章 ---------- */
async function loadSystem() {
  try {
    const sys = await apiJson("/api/system");
    const dot = $("deviceBadge").querySelector(".dot");
    if (sys.device === "cuda") {
      dot.className = "dot ok";
      $("deviceText").textContent = `GPU 已就绪：${sys.device_name}${sys.gpu_count > 1 ? " ×" + sys.gpu_count : ""}（CUDA ${sys.cuda_version || ""}）`;
    } else {
      dot.className = "dot";
      $("deviceText").textContent = "未检测到 GPU，将使用 CPU 训练";
    }
  } catch { $("deviceText").textContent = "后端连接失败"; }
}

/* ---------- 数据集 ---------- */
function renderDatasetSelect() {
  const sel = $("datasetSelect");
  sel.innerHTML = "";
  if (!state.datasets.length) {
    sel.innerHTML = `<option value="">（暂无数据集）</option>`;
    $("btnStart").disabled = true;
    return;
  }
  for (const d of state.datasets) {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = `${d.name}（${d.rows} 行 × ${d.columns.length} 列）`;
    sel.appendChild(opt);
  }
  if (state.datasetId && state.datasets.some((d) => d.id === state.datasetId)) {
    sel.value = state.datasetId;
  } else {
    state.datasetId = state.datasets[0].id;
  }
  sel.dispatchEvent(new Event("change"));
}

async function loadDatasets(keepId) {
  state.datasets = await apiJson("/api/datasets");
  if (keepId) state.datasetId = keepId;
  renderDatasetSelect();
}

async function loadSamples() {
  try {
    const samples = await apiJson("/api/samples");
    const box = $("sampleBox");
    box.innerHTML = "";
    for (const s of samples) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = "＋ " + s.name.replace(".csv", "");
      b.title = "导入示例数据集 " + s.name;
      b.onclick = async () => {
        try {
          const meta = await apiJson(`/api/datasets/sample/${encodeURIComponent(s.name)}`, { method: "POST" });
          toast("示例数据已导入: " + meta.name, "ok");
          await loadDatasets(meta.id);
        } catch (e) { toast("导入失败: " + e.message, "err"); }
      };
      box.appendChild(b);
    }
  } catch { /* 静默 */ }
}

async function loadPreview() {
  const wrap = $("previewWrap"), metaBox = $("previewMeta");
  const targetSel = $("targetSelect");
  targetSel.innerHTML = "";
  $("previewMeta").hidden = true;
  metaBox.textContent = "";
  if (!state.datasetId) { wrap.innerHTML = `<div class="empty">选择或上传数据集后在此预览</div>`; state.preview = null; updateStart(); return; }
  try {
    const d = await apiJson(`/api/datasets/${state.datasetId}`);
    state.preview = d;
    // 目标列下拉（默认最后一列）
    for (const c of d.columns) {
      const opt = document.createElement("option");
      opt.value = c; opt.textContent = c;
      targetSel.appendChild(opt);
    }
    targetSel.value = d.columns[d.columns.length - 1];
    targetSel.onchange = updateStart;
    taskSelect.onchange = updateStart;
    // 预览表
    let html = `<table class="preview-table"><tr>${d.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
    for (const row of (d.preview || []).slice(0, 5)) {
      html += `<tr>${d.columns.map((c) => `<td>${esc(row[c] ?? "")}</td>`).join("")}</tr>`;
    }
    html += "</table>";
    wrap.innerHTML = html;
    metaBox.hidden = false;
    metaBox.textContent = `${d.rows} 行 · ${d.columns.length} 列 · 仅展示前 5 行`;
  } catch (e) {
    wrap.innerHTML = `<div class="empty">预览失败：${esc(e.message)}</div>`;
    state.preview = null;
  }
  updateStart();
}

function updateStart() {
  $("btnStart").disabled = !(state.datasetId && $("targetSelect").value);
}

/* 上传 */
$("btnUpload").onclick = () => $("fileInput").click();
$("fileInput").onchange = async () => {
  const f = $("fileInput").files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append("file", f);
  toast("正在上传 " + f.name + " …");
  try {
    const meta = await apiJson("/api/datasets", { method: "POST", body: fd });
    toast("数据集已上传: " + meta.name, "ok");
    $("fileInput").value = "";
    await loadDatasets(meta.id);
  } catch (e) { toast("上传失败: " + e.message, "err"); }
};

$("datasetSelect").onchange = (e) => { state.datasetId = e.target.value; loadPreview(); };

/* ---------- 训练任务 ---------- */
const taskSelect = $("taskSelect");

$("btnStart").onclick = async () => {
  if (!state.datasetId || !$("targetSelect").value) return;
  const payload = {
    dataset_id: state.datasetId,
    target: $("targetSelect").value,
    task: taskSelect.value,
    epochs: Number($("p_epochs").value),
    batch_size: Number($("p_batch_size").value),
    lr: Number($("p_lr").value),
    hidden_layers: Number($("p_hidden_layers").value),
    hidden_size: Number($("p_hidden_size").value),
    test_split: Number($("p_test_split").value),
    seed: 42,
  };
  $("btnStart").disabled = true;
  try {
    const { job_id } = await apiJson("/api/train", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
    });
    toast("训练任务已创建: " + job_id, "ok");
    selectJob(job_id, true);
  } catch (e) { toast("创建任务失败: " + e.message, "err"); }
  updateStart();
};

const statusText = { queued: "排队中", running: "训练中", completed: "已完成", failed: "失败", cancelled: "已取消" };

function jobCard(j) {
  const m = j.spec.params || {};
  const last = (j.metrics || []).slice(-1)[0] || {};
  const taskLabel = j.spec.task === "regression" ? "回归" : "分类";
  const pct = j.progress ? Math.round(j.progress.percent) : 0;
  const active = j.id === state.jobId ? " active" : "";
  let metric = "";
  if (last.val_accuracy !== undefined) metric = `acc ${fmtLoss(last.val_accuracy)}`;
  else if (last.val_r2 !== undefined) metric = `R² ${fmtLoss(last.val_r2)}`;
  return `<div class="jobcard${active}" data-id="${esc(j.id)}">
    <div class="jobline">
      <span class="jobname">${esc(j.spec.target)} · ${taskLabel}</span>
      <span class="chip st-${esc(j.status)}">${statusText[j.status] || j.status}</span>
      <span class="chip">${esc(j.spec.dataset_name || "")}</span>
    </div>
    <div class="chips">
      <span class="chip">ep ${m.epochs}</span><span class="chip">bs ${m.batch_size}</span>
      <span class="chip">lr ${m.lr}</span>${metric ? `<span class="chip">${metric}</span>` : ""}
      <span class="chip">${fmtTime(j.created_at)}</span>
    </div>
    <div class="progress ${(j.status === "completed" ? "done" : "") + (j.status === "failed" || j.status === "cancelled" ? " failed" : "")}">
      <div style="width:${pct}%"></div></div>
  </div>`;
}

async function refreshJobs() {
  try {
    state.jobs = await apiJson("/api/jobs");
    const box = $("jobList");
    box.innerHTML = state.jobs.length ? state.jobs.map(jobCard).join("") : `<div class="empty">暂无任务，先在左侧发起训练</div>`;
    box.querySelectorAll(".jobcard").forEach((el) => {
      el.onclick = () => selectJob(el.dataset.id);
    });
    if (!state.jobId && state.jobs.length) selectJob(state.jobs[0].id);
    else if (state.jobId && !state.jobs.some((j) => j.id === state.jobId)) {
      state.jobId = null;
      $("detail").hidden = true;
    }
    if ($("predictInput").value.trim() === "" && state.jobId) fillPredictTemplate();
    if (state.jobId) loadDetail();
  } catch (e) { /* 轮询失败静默 */ }
}

function selectJob(id, clearLog) {
  if (state.jobId !== id) {
    state.jobId = id;
    state.logOffset = 0;
    $("logBox").textContent = "";
    $("resultBox").innerHTML = `<div class="empty">任务完成后展示评估结果</div>`;
    $("predictOut").hidden = true;
    fillPredictTemplate();
  }
  $("detail").hidden = false;
  refreshJobsSoon();
}

/* ---------- 详情 ---------- */
async function loadDetail() {
  let j;
  try { j = await apiJson(`/api/jobs/${state.jobId}`); }
  catch { state.jobId = null; $("detail").hidden = true; return; }

  const taskLabel = j.spec.task === "regression" ? "回归" : "分类";
  $("dName").textContent = `${j.spec.target} · ${taskLabel}（${j.spec.dataset_name || ""}）`;
  const st = $("dStatus");
  st.textContent = statusText[j.status] || j.status;
  st.className = "chip st-" + j.status;
  $("dDevice").textContent = j.device ? (j.device === "cuda" ? "GPU" : "CPU") : "设备待分配";

  $("btnCancel").hidden = !(j.status === "queued" || j.status === "running");
  $("btnDownload").hidden = !j.summary;
  $("btnDelete").onclick = async () => {
    if (!confirm("确定删除该任务及其产物？")) return;
    try { await apiJson(`/api/jobs/${j.id}`, { method: "DELETE" }); toast("任务已删除", "ok"); state.jobId = null; $("detail").hidden = true; }
    catch (e) { toast(e.message, "err"); }
  };
  $("btnCancel").onclick = async () => {
    if (!confirm("确定取消训练？")) return;
    try { await apiJson(`/api/jobs/${j.id}/cancel`, { method: "POST" }); toast("已发送取消请求"); }
    catch (e) { toast(e.message, "err"); }
  };

  const bar = $("dProgress");
  bar.className = "progress" + (j.status === "completed" ? " done" : (j.status === "failed" || j.status === "cancelled" ? " failed" : ""));
  const pct = Math.round(j.progress.percent || 0);
  bar.querySelector("div").style.width = pct + "%";
  let ptxt = `进度 ${pct}%`;
  if (j.progress.epochs_total) ptxt = `epoch ${j.progress.epoch}/${j.progress.epochs_total}`;
  if (j.status === "failed" && j.error) ptxt += ` · ${esc(j.error)}`;
  if (j.summary && j.summary.duration_sec) ptxt += ` · 用时 ${j.summary.duration_sec}s`;
  $("dProgressText").innerHTML = ptxt;

  j.metrics = j.metrics || [];
  if (state.activeTab === "curves") renderCharts(j);
  if (state.activeTab === "logs") await tailLogs(j.id);
  if (state.activeTab === "result") renderResult(j);
}

/* ---------- 图表 ---------- */
function ensureCharts() {
  if (typeof Chart === "undefined") {
    $("chartNote").textContent = "图表组件（Chart.js CDN）未加载，检查浏览器网络后刷新。";
    return false;
  }
  Chart.defaults.color = "#9fb0c7";
  Chart.defaults.borderColor = "rgba(45,51,59,.8)";
  if (!state.charts.loss) {
    state.charts.loss = new Chart($("lossChart"), {
      type: "line",
      data: { labels: [], datasets: [
        { label: "train_loss", data: [], borderColor: "#58a6ff", pointRadius: 0, borderWidth: 2, tension: 0.25 },
        { label: "val_loss", data: [], borderColor: "#f0883e", pointRadius: 0, borderWidth: 2, tension: 0.25 },
      ]},
      options: { animation: false, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } },
    });
    state.charts.metric = new Chart($("metricChart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "metric", data: [], borderColor: "#3fb950", pointRadius: 0, borderWidth: 2, tension: 0.25 }] },
      options: { animation: false, maintainAspectRatio: true, scales: { y: { beginAtZero: true } } },
    });
  }
  return true;
}

function renderCharts(j) {
  if (!ensureCharts()) return;
  const m = j.metrics;
  const labels = m.map((r) => r.epoch);
  const loss = state.charts.loss;
  loss.data.labels = labels;
  loss.data.datasets[0].data = m.map((r) => r.train_loss);
  loss.data.datasets[1].data = m.map((r) => r.val_loss);
  loss.update("none");

  const metric = state.charts.metric;
  let key, title;
  if (j.spec.task === "regression") { key = "val_r2"; title = "验证 R²（越高越好）"; }
  else { key = "val_accuracy"; title = "验证准确率 accuracy"; }
  if (state.metricKind !== key) {
    state.metricKind = key;
    metric.data.datasets[0].label = key;
    metric.data.datasets[0].data = [];
  }
  $("metricTitle").textContent = title;
  metric.data.labels = labels;
  metric.data.datasets[0].data = m.map((r) => r[key]);
  metric.update("none");
  $("chartNote").textContent = m.length ? "" : "暂无数据，任务启动后每个 epoch 更新一条记录。";
}

/* ---------- 日志 ---------- */
async function tailLogs(id) {
  try {
    const d = await apiJson(`/api/jobs/${encodeURIComponent(id)}/logs?offset=${state.logOffset}`);
    if (id !== state.jobId) return;
    if (d.lines.length) {
      $("logBox").textContent += d.lines.join("\n") + "\n";
      state.logOffset = d.next_offset;
      const box = $("logBox");
      box.scrollTop = box.scrollHeight;
    }
  } catch { /* 静默 */ }
}

/* ---------- 结果 ---------- */
function renderResult(j) {
  const box = $("resultBox");
  const s = j.summary;
  if (!s) {
    box.innerHTML = `<div class="empty">${j.status === "running" ? "训练进行中…" : "任务完成后展示评估结果"}</div>`;
    return;
  }
  const stat = (k, v) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  let html = `<div class="statgrid">`;
  html += stat("最佳 epoch", s.best_epoch + " / " + s.epochs_total);
  if (j.spec.task === "regression") {
    html += stat("验证 R²", fmtLoss(s.final.val_r2));
    html += stat("验证 RMSE", fmtLoss(s.final.val_rmse));
    html += stat("验证 MAE", fmtLoss(s.final.val_mae));
  } else {
    html += stat("验证准确率", (s.final.val_accuracy * 100).toFixed(2) + "%");
  }
  html += stat("验证 loss", fmtLoss(s.final.val_loss));
  html += stat("样本", `${s.rows.train} / ${s.rows.val}`);
  html += stat("特征数", s.features);
  html += stat("设备", s.device === "cuda" ? "GPU" : "CPU");
  html += stat("用时", s.duration_sec + "s");
  html += `</div>`;

  if (s.report) {
    html += `<h2 style="margin-top:6px;">分类报告（验证集）</h2><table class="report"><tr><th>类别</th><th>precision</th><th>recall</th><th>f1</th><th>support</th></tr>`;
    for (const [k, v] of Object.entries(s.report)) {
      if (k === "accuracy") continue;
      const label = k.endsWith("avg") ? k : String(k);
      html += `<tr><td>${esc(label)}</td><td>${(+v.precision).toFixed(3)}</td><td>${(+v.recall).toFixed(3)}</td><td>${(+v["f1-score"]).toFixed(3)}</td><td>${v.support}</td></tr>`;
    }
    html += `<tr><td>accuracy</td><td colspan="3">${(s.report.accuracy * 100).toFixed(2)}%</td><td>${s.report["macro avg"].support}</td></tr>`;
    html += `</table>`;
  }
  if (s.classes) html += `<div class="hint">类别: ${esc(s.classes.join("、"))}</div>`;
  html += `<div class="hint" style="margin-top:8px;">模型权重已保存为该任务的 best.pt，可在右上角「下载模型」，或切到「预测」页使用。</div>`;
  box.className = "";
  box.innerHTML = html;
}

/* ---------- 预测 ---------- */
async function fillPredictTemplate() {
  const j = state.jobs.find((x) => x.id === state.jobId);
  if (!j) return;
  try {
    const d = await apiJson(`/api/datasets/${j.spec.dataset_id}`);
    if (d.preview && d.preview[0]) {
      const row = { ...d.preview[0] };
      delete row[j.spec.target];
      for (const k of Object.keys(row)) if (row[k] === null) delete row[k];
      $("predictInput").value = JSON.stringify(row, null, 2);
    }
  } catch { /* 无预览则留空 */ }
}

$("btnPredict").onclick = async () => {
  const out = $("predictOut");
  let body;
  try { body = { row: JSON.parse($("predictInput").value) }; }
  catch (e) { toast("预测输入不是合法 JSON: " + e.message, "err"); return; }
  try {
    const r = await apiJson(`/api/jobs/${state.jobId}/predict`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    out.hidden = false;
    let txt = "预测结果: " + (typeof r.prediction === "number" ? r.prediction.toFixed(4) : r.prediction);
    if (r.probabilities) txt += "\n各类别概率:\n" + Object.entries(r.probabilities).map(([k, v]) => `  ${k}: ${(v * 100).toFixed(2)}%`).join("\n");
    out.textContent = txt;
  } catch (e) { toast(e.message, "err"); out.hidden = true; }
};

/* ---------- Tab 切换 ---------- */
document.querySelectorAll(".tabs button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("active", x === b));
    state.activeTab = b.dataset.tab;
    for (const t of ["curves", "logs", "result", "predict"]) $("tab-" + t).hidden = t !== state.activeTab;
    refreshJobsSoon();
  };
});
let detailTimer = null;
function refreshJobsSoon() { clearTimeout(detailTimer); detailTimer = setTimeout(refreshJobs, 30); }
$("btnDownload").onclick = () => { if (state.jobId) location.href = `/api/jobs/${state.jobId}/model`; };

/* ---------- 启动 ---------- */
(async function init() {
  loadSystem();
  setInterval(loadSystem, 15000);
  loadSamples();
  try { await loadDatasets(); } catch (e) { toast("加载数据集失败: " + e.message, "err"); }
  await refreshJobs();
  setInterval(refreshJobs, 1500);
})();
</script>
</body>
</html>
