# 可视化模型训练平台（多机多卡 / 无状态训练版）
#
# 架构（三平面分离）：
# - 控制平面：trainer（FastAPI API + 前端）
# - 协调平面：redis（任务队列 + 租约/心跳 + worker 注册，watchdog 依赖）
# - 状态平面：minio（数据集 + checkpoint + 产物；job.json 权威，MySQL 仅镜像）
# - 计算平面：worker（supervisor 一卡一子进程，GPU 只是可随时释放的计算单元；
#   任意 worker 崩溃/掉卡，任务由其它卡/机器从 checkpoint 接续）
#
# 前置条件：宿主机已安装 NVIDIA 驱动 + nvidia-container-toolkit（Linux）
#          或 Docker Desktop（Windows WSL2）已启用 GPU。
# 纯 CPU 环境使用: docker compose -f docker-compose.cpu.yml up
#
# 本地单机开发（不依赖 Redis/MinIO，也可不用本文件）：API 进程内嵌 worker，
# 状态平面回落到 ./data 本地文件（STORAGE_BACKEND=local）。
#
# 注意：本项目使用可配置的已有 MySQL 服务器，不创建 MySQL 容器；
#      未配置时 USE_DATABASE=false，主流程仅文件存储不受影响。

x-backend-env: &backend-env
  # ---- 协调平面 ----
  REDIS_URL: redis://redis:6379/0
  # ---- 状态平面 ----
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-mtp-artifacts}
  MINIO_SECURE: "false"
  # ---- 数据目录（数据集缓存 / worker scratch）----
  DATA_DIR: /app/data
  # ---- 任务重试 / watchdog ----
  JOB_MAX_AUTO_RETRY: ${JOB_MAX_AUTO_RETRY:-5}
  JOB_RETRY_BACKOFF: ${JOB_RETRY_BACKOFF:-2}
  WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-5}
  # ---- worker ----
  WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-10}
  WORKER_LEASE_TTL: ${WORKER_LEASE_TTL:-30}
  WORKER_SUPERVISOR_PROBE_INTERVAL: ${WORKER_SUPERVISOR_PROBE_INTERVAL:-15}
  WORKER_CPU_SLOTS: ${WORKER_CPU_SLOTS:-1}
  WORKER_CHECKPOINT_INTERVAL: ${WORKER_CHECKPOINT_INTERVAL:-5}
  WORKER_CHECKPOINT_KEEP: ${WORKER_CHECKPOINT_KEEP:-3}

services:
  redis:
    image: redis:7-alpine
    container_name: mtp-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: mtp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  trainer:
    build: ./backend
    container_name: mtp-trainer
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      <<: *backend-env
      # 单机零依赖开发：STORAGE_BACKEND=local / REDIS_URL 留空时，
      # API 进程内嵌 worker 线程，协调平面为进程内实现
      USE_DATABASE: ${USE_DATABASE:-false}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-model_training}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_COLLATION: ${DB_COLLATION:-utf8mb4_unicode_ci}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_ECHO: ${DB_ECHO:-false}
      EMBEDDED_WORKERS: ${EMBEDDED_WORKERS:-0}   # 多机模式下训练交给 worker 服务
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: mtp-worker
    volumes:
      - ./data:/app/data   # 本地 scratch 与数据集缓存（权威数据在 MinIO）
    environment:
      <<: *backend-env
      USE_DATABASE: ${USE_DATABASE:-false}
    gpus: all               # 一卡一进程：supervisor 按 CUDA_VISIBLE_DEVICES 拆分
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # 运行 supervisor：探测可见 GPU 数 N → N 个“一卡一子进程”+WORKER_CPU_SLOTS 个 CPU 槽

volumes:
  redis-data:
  minio-data:
