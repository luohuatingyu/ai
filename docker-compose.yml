# 可视化模型训练平台（多机多卡 / 无状态训练版）
#
# 架构（四平面分离）：
# - 控制平面：trainer（FastAPI API + 前端）
# - 协调平面：redis（任务队列 + 租约/心跳 + worker 注册，watchdog 依赖）
# - 状态平面：seaweedfs（S3 兼容对象存储：数据集 + checkpoint + 产物；
#   job.json 权威，MySQL 仅镜像；也可换成阿里云 OSS / 腾讯云 COS 等 S3 服务）
# - 计算平面：worker（supervisor 一卡一子进程，GPU 只是可随时释放的计算单元；
#   任意 worker 崩溃/掉卡，任务由其它卡/机器从 checkpoint 接续）
#
# 前置条件：宿主机已安装 NVIDIA 驱动 + nvidia-container-toolkit（Linux）
#          或 Docker Desktop（Windows WSL2）已启用 GPU。
# 纯 CPU 环境使用: docker compose -f docker-compose.cpu.yml up
#
# 本地单机开发（不依赖 Redis/SeaweedFS，也可不用本文件）：API 进程内嵌 worker，
# 状态平面回落到 ./data 本地文件（STORAGE_BACKEND=local）。
#
# 注意：本项目使用可配置的已有 MySQL 服务器，不创建 MySQL 容器；
#      未配置时 USE_DATABASE=false，主流程仅文件存储不受影响。

x-backend-env: &backend-env
  # ---- 协调平面 (外部Redis容器，地址来自.env) ----
  REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  # ---- 状态平面（S3 兼容：SeaweedFS / OSS / COS / S3 均可）----
  STORAGE_BACKEND: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-mtp-artifacts}
  S3_SECURE: "${S3_SECURE:-false}"
  # ---- 数据库 (外部MySQL容器，地址来自.env) ----
  DB_HOST: ${DB_HOST:-localhost}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:-root}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_NAME: ${DB_NAME:-model_training}
  DB_CHARSET: ${DB_CHARSET:-utf8mb4}
  DB_COLLATION: ${DB_COLLATION:-utf8mb4_unicode_ci}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
  DB_ECHO: ${DB_ECHO:-false}
  # ---- 数据目录（数据集缓存 / worker scratch）----
  DATA_DIR: /app/data
  # ---- 任务重试 / watchdog ----
  JOB_MAX_AUTO_RETRY: ${JOB_MAX_AUTO_RETRY:-5}
  JOB_RETRY_BACKOFF: ${JOB_RETRY_BACKOFF:-2}
  WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-5}
  # ---- worker ----
  WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-10}
  WORKER_LEASE_TTL: ${WORKER_LEASE_TTL:-30}
  WORKER_SUPERVISOR_PROBE_INTERVAL: ${WORKER_SUPERVISOR_PROBE_INTERVAL:-15}
  WORKER_CPU_SLOTS: ${WORKER_CPU_SLOTS:-2}
  WORKER_CHECKPOINT_INTERVAL: ${WORKER_CHECKPOINT_INTERVAL:-5}
  WORKER_CHECKPOINT_KEEP: ${WORKER_CHECKPOINT_KEEP:-3}
  # ---- 数据集导入限额：防超大上传 / 压缩炸弹 / 超宽表 ----
  DATASET_MAX_FILE_SIZE: ${DATASET_MAX_FILE_SIZE:-524288000}
  DATASET_MAX_ROWS: ${DATASET_MAX_ROWS:-2000000}
  DATASET_MAX_COLUMNS: ${DATASET_MAX_COLUMNS:-100}
  DATASET_MAX_ARCHIVE_FILES: ${DATASET_MAX_ARCHIVE_FILES:-10000}
  DATASET_MAX_ARCHIVE_MEMBER_BYTES: ${DATASET_MAX_ARCHIVE_MEMBER_BYTES:-524288000}
  DATASET_MAX_ARCHIVE_EXPANDED_BYTES: ${DATASET_MAX_ARCHIVE_EXPANDED_BYTES:-1073741824}
  DATASET_MAX_COMPRESSION_RATIO: ${DATASET_MAX_COMPRESSION_RATIO:-200}
  DATASET_MAX_IMPORT_FILES: ${DATASET_MAX_IMPORT_FILES:-1000}
  # ---- 预测（inference）稳定性：小规格槽位防 OOM / 防心跳误杀 ----
  INFERENCE_NUM_THREADS: ${INFERENCE_NUM_THREADS:-1}
  INFERENCE_NICE: ${INFERENCE_NICE:-5}
  INFERENCE_LEASE_TTL: ${INFERENCE_LEASE_TTL:-90}
  INFERENCE_HEARTBEAT_INTERVAL: ${INFERENCE_HEARTBEAT_INTERVAL:-10}
  INFERENCE_MIN_FREE_MEMORY_MB: ${INFERENCE_MIN_FREE_MEMORY_MB:-256}
  INFERENCE_TORCH_MIN_FREE_MEMORY_MB: ${INFERENCE_TORCH_MIN_FREE_MEMORY_MB:-640}
  WORKER_IMAGE: ${WORKER_IMAGE:-mtp-worker:local}
  WORKER_REMOTE_IMAGE: ${WORKER_IMAGE:-mtp-worker:local}

services:
  seaweedfs:
    # S3 兼容对象存储（状态平面）。国内网络拉取失败时可在 .env 中把
    # SEAWEEDFS_IMAGE 换成国内镜像源，例如：
    #   SEAWEEDFS_IMAGE=docker.m.daocloud.io/chrislusf/seaweedfs:latest
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: mtp-seaweedfs
    # -ip=0.0.0.0 使 S3/filer 监听全部接口（默认只绑容器网卡 IP，健康检查无法走 localhost）
    command: server -s3 -filer -dir=/data -ip=0.0.0.0
    ports:
      - "9000:8333"   # S3 API（宿主 9000 端口保持与旧版体验一致）
      - "9001:8888"   # 控制台（filer Web UI）
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  trainer:
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: mtp-trainer
    # 仅内网：对外入口统一走 frontend 容器（同源代理 /api）
    # 本地单进程开发仍可直接 uvicorn app.main:app（后端自带静态兜底）
    # 外部 mysql/redis 容器发布在宿主机 localhost:3306 / localhost:6379；
    # 将容器内 localhost 映射到宿主机网关，使 .env 中的 localhost 配置在容器内直接生效
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    environment:
      <<: *backend-env
      # 单机零依赖开发：STORAGE_BACKEND=local / REDIS_URL 留空时，
      # API 进程内嵌 worker 线程，协调平面为进程内实现
      USE_DATABASE: ${USE_DATABASE:-false}
      EMBEDDED_WORKERS: ${EMBEDDED_WORKERS:-0}   # 多机模式下训练交给 worker 服务
      WORKER_REMOTE_REDIS_URL: ${WORKER_REMOTE_REDIS_URL:-}
      WORKER_REMOTE_REDIS_PASSWORD: ${WORKER_REMOTE_REDIS_PASSWORD:-}
      WORKER_REMOTE_S3_ENDPOINT: ${WORKER_REMOTE_S3_ENDPOINT:-}
      WORKER_SSH_CREDENTIAL_ENCRYPTION_KEY: ${WORKER_SSH_CREDENTIAL_ENCRYPTION_KEY:-}
      # 新增：Notebook / 模板 / 模型注册表 / Pipeline / 分布式训练
      NOTEBOOK_MAX_SESSIONS: ${NOTEBOOK_MAX_SESSIONS:-20}
      NOTEBOOK_SESSION_TTL: ${NOTEBOOK_SESSION_TTL:-7200}
      NOTEBOOK_CELL_TIMEOUT: ${NOTEBOOK_CELL_TIMEOUT:-300}
      MODEL_AUTO_REGISTER: ${MODEL_AUTO_REGISTER:-true}
      MODEL_REGISTRY_OSS_PREFIX: ${MODEL_REGISTRY_OSS_PREFIX:-models/}
      PIPELINE_MAX_CONCURRENT_RUNS: ${PIPELINE_MAX_CONCURRENT_RUNS:-5}
      DISTRIBUTED_BACKEND: ${DISTRIBUTED_BACKEND:-nccl}
      HETERO_PLACEMENT_STRATEGY: ${HETERO_PLACEMENT_STRATEGY:-memory_aware}
      RESOURCE_SELECTOR_DEFAULT_STRATEGY: ${RESOURCE_SELECTOR_DEFAULT_STRATEGY:-auto}
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # 前端容器（Vue 3 + Vite 构建产物，Nginx 托管 + /api 反向代理）
    build:
      context: ./frontend-vue
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: mtp-frontend
    ports:
      - "8000:80"   # 页面与 API 同源入口
    depends_on:
      - trainer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:-mtp-worker:local}
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: mtp-worker
    # 计算平面：Worker 宿主进程（注册/心跳/领任务/启动内核与训练）
    command: ["python", "-m", "app.compute.worker_host"]
    stop_grace_period: 45s
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data   # 本地 scratch 与数据集缓存（权威数据在 S3 状态平面）
    environment:
      <<: *backend-env
      USE_DATABASE: ${USE_DATABASE:-false}
      WORKER_MACHINE_ID: ${WORKER_MACHINE_ID:-}
      WORKER_MANAGED: ${WORKER_MANAGED:-false}
      # 同一 Compose 网络内的 CPU/GPU 槽使用服务名互联；跨机器部署请显式配置训练网地址并使用受管 worker。
      WORKER_DISTRIBUTED_HOST: ${WORKER_DISTRIBUTED_HOST:-worker}
      # 分布式训练（异构感知）
      DISTRIBUTED_BACKEND: ${DISTRIBUTED_BACKEND:-nccl}
      HETERO_PLACEMENT_STRATEGY: ${HETERO_PLACEMENT_STRATEGY:-memory_aware}
      HETERO_ALLOW_CPU_FALLBACK: ${HETERO_ALLOW_CPU_FALLBACK:-true}
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    # Pipeline 定时调度器（独立进程，控制平面扩展）
    build:
      context: ./backend
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: mtp-scheduler
    command: ["python", "-m", "app.orchestration.scheduler_service"]
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - ./data:/app/data
    environment:
      <<: *backend-env
      USE_DATABASE: ${USE_DATABASE:-false}
    depends_on:
      - trainer
    restart: unless-stopped
    profiles: ["scheduler"]   # 按需启动：docker compose --profile scheduler up

volumes:
  seaweedfs-data:
