# 可视化模型训练平台（多机多卡 / 无状态训练版）
#
# 架构（四平面分离）：
# - 控制平面：trainer（FastAPI API + 前端）
# - 协调平面：redis（任务队列 + 租约/心跳 + worker 注册，watchdog 依赖）
# - 状态平面：seaweedfs（S3 兼容对象存储：数据集 + checkpoint + 产物；
#   job.json 权威，MySQL 仅镜像；也可换成阿里云 OSS / 腾讯云 COS 等 S3 服务）
# - 计算平面：worker（supervisor 一卡一子进程，GPU 只是可随时释放的计算单元；
#   任意 worker 崩溃/掉卡，任务由其它卡/机器从 checkpoint 接续）
#
# 前置条件：宿主机已安装 NVIDIA 驱动 + nvidia-container-toolkit（Linux）
#          或 Docker Desktop（Windows WSL2）已启用 GPU。
# 纯 CPU 环境使用: docker compose -f docker-compose.cpu.yml up
#
# 本地单机开发（不依赖 Redis/SeaweedFS，也可不用本文件）：API 进程内嵌 worker，
# 状态平面回落到 ./data 本地文件（STORAGE_BACKEND=local）。
#
# 注意：本项目使用可配置的已有 MySQL 服务器，不创建 MySQL 容器；
#      未配置时 USE_DATABASE=false，主流程仅文件存储不受影响。

x-backend-env: &backend-env
  # ---- 协调平面 (外部Redis容器，地址来自.env) ----
  REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
  # ---- 状态平面（S3 兼容：SeaweedFS / OSS / COS / S3 均可）----
  STORAGE_BACKEND: s3
  S3_ENDPOINT: seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-mtp-artifacts}
  S3_SECURE: "false"
  # ---- 数据库 (外部MySQL容器，地址来自.env) ----
  DB_HOST: ${DB_HOST:-localhost}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:-root}
  DB_PASSWORD: ${DB_PASSWORD:-password}
  DB_NAME: ${DB_NAME:-model_training}
  DB_CHARSET: ${DB_CHARSET:-utf8mb4}
  DB_COLLATION: ${DB_COLLATION:-utf8mb4_unicode_ci}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
  DB_ECHO: ${DB_ECHO:-false}
  # ---- 数据目录（数据集缓存 / worker scratch）----
  DATA_DIR: /app/data
  # ---- 任务重试 / watchdog ----
  JOB_MAX_AUTO_RETRY: ${JOB_MAX_AUTO_RETRY:-5}
  JOB_RETRY_BACKOFF: ${JOB_RETRY_BACKOFF:-2}
  WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-5}
  # ---- worker ----
  WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-10}
  WORKER_LEASE_TTL: ${WORKER_LEASE_TTL:-30}
  WORKER_SUPERVISOR_PROBE_INTERVAL: ${WORKER_SUPERVISOR_PROBE_INTERVAL:-15}
  WORKER_CPU_SLOTS: ${WORKER_CPU_SLOTS:-2}
  WORKER_CHECKPOINT_INTERVAL: ${WORKER_CHECKPOINT_INTERVAL:-5}
  WORKER_CHECKPOINT_KEEP: ${WORKER_CHECKPOINT_KEEP:-3}

services:
  seaweedfs:
    # S3 兼容对象存储（状态平面）。国内网络拉取失败时可在 .env 中把
    # SEAWEEDFS_IMAGE 换成国内镜像源，例如：
    #   SEAWEEDFS_IMAGE=docker.m.daocloud.io/chrislusf/seaweedfs:latest
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: mtp-seaweedfs
    # -ip=0.0.0.0 使 S3/filer 监听全部接口（默认只绑容器网卡 IP，健康检查无法走 localhost）
    command: server -s3 -filer -dir=/data -ip=0.0.0.0
    ports:
      - "9000:8333"   # S3 API（宿主 9000 端口保持与旧版体验一致）
      - "9001:8888"   # 控制台（filer Web UI）
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  trainer:
    build: ./backend
    container_name: mtp-trainer
    ports:
      - "8000:8000"
    # 外部 mysql/redis 容器发布在宿主机 localhost:3306 / localhost:6379；
    # 将容器内 localhost 映射到宿主机网关，使 .env 中的 localhost 配置在容器内直接生效
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    environment:
      <<: *backend-env
      # 单机零依赖开发：STORAGE_BACKEND=local / REDIS_URL 留空时，
      # API 进程内嵌 worker 线程，协调平面为进程内实现
      USE_DATABASE: ${USE_DATABASE:-false}
      EMBEDDED_WORKERS: ${EMBEDDED_WORKERS:-0}   # 多机模式下训练交给 worker 服务
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    container_name: mtp-worker
    # 计算平面：supervisor 按 WORKER_CPU_SLOTS 拉起 CPU 执行槽（一卡一进程的 CPU 版）
    command: ["python", "-m", "app.worker"]
    extra_hosts:
      - "localhost:host-gateway"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data   # 本地 scratch 与数据集缓存（权威数据在 S3 状态平面）
    environment:
      <<: *backend-env
      USE_DATABASE: ${USE_DATABASE:-false}
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  seaweedfs-data:
