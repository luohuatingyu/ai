# 远程服务器管理覆盖配置：平台 trainer 使用统一配置的 SSH 凭证和已核验 known_hosts。
# 密钥认证需配置 WORKER_SSH_KEY_HOST_PATH；密码认证可省略，Compose 会挂载 /dev/null 占位。
# WORKER_SSH_KNOWN_HOSTS_HOST_PATH 始终需要指向平台宿主机上已核验的只读文件。

services:
  trainer:
    volumes:
      - type: bind
        source: ${WORKER_SSH_KEY_HOST_PATH:-/dev/null}
        target: /run/remote-worker/ssh_key
        read_only: true
      - type: bind
        source: ${WORKER_SSH_KNOWN_HOSTS_HOST_PATH:?请设置 WORKER_SSH_KNOWN_HOSTS_HOST_PATH}
        target: /run/remote-worker/known_hosts
        read_only: true
    environment:
      WORKER_REMOTE_ENABLED: "true"
