# 可视化模型训练平台（多机架构 · 纯 CPU 环境版）
# 与 docker-compose.yml 同一镜像与同一套服务编排，仅不声明 GPU；
# 计算平面 worker 以 CPU 执行槽运行（require_gpu 的任务会等待 GPU 节点加入）。
# GPU 环境就绪后请改用 GPU 版获得加速。
#
# 状态平面为 SeaweedFS（S3 兼容对象存储），亦可换成阿里云 OSS / 腾讯云 COS 等
# S3 服务（修改 S3_* 环境变量即可）。

# 注意：本项目使用可配置的已有 MySQL 服务器，不创建 MySQL 容器。

x-backend-env: &backend-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  STORAGE_BACKEND: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-mtp-artifacts}
  S3_SECURE: "${S3_SECURE:-false}"
  DATA_DIR: /app/data
  JOB_MAX_AUTO_RETRY: ${JOB_MAX_AUTO_RETRY:-5}
  JOB_RETRY_BACKOFF: ${JOB_RETRY_BACKOFF:-2}
  WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-5}
  WORKER_HEARTBEAT_INTERVAL: ${WORKER_HEARTBEAT_INTERVAL:-10}
  WORKER_LEASE_TTL: ${WORKER_LEASE_TTL:-30}
  WORKER_SUPERVISOR_PROBE_INTERVAL: ${WORKER_SUPERVISOR_PROBE_INTERVAL:-15}
  WORKER_CPU_SLOTS: ${WORKER_CPU_SLOTS:-2}
  WORKER_CHECKPOINT_INTERVAL: ${WORKER_CHECKPOINT_INTERVAL:-5}
  WORKER_CHECKPOINT_KEEP: ${WORKER_CHECKPOINT_KEEP:-3}
  WORKER_IMAGE: ${WORKER_IMAGE:-mtp-worker-cpu:local}
  WORKER_REMOTE_IMAGE: ${WORKER_IMAGE:-mtp-worker-cpu:local}

services:
  redis:
    image: redis:7-alpine
    container_name: mtp-redis-cpu
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data-cpu:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  seaweedfs:
    # 镜像源可通过 .env 的 SEAWEEDFS_IMAGE 切换（国内网络可用国内镜像源）
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: mtp-seaweedfs-cpu
    # -ip=0.0.0.0 使 S3/filer 监听全部接口（默认只绑容器网卡 IP，健康检查无法走 localhost）
    command: server -s3 -filer -dir=/data -ip=0.0.0.0
    ports:
      - "9000:8333"   # S3 API（宿主 9000 端口保持与旧版体验一致）
      - "9001:8888"   # 控制台（filer Web UI）
    volumes:
      - seaweedfs-data-cpu:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  trainer:
    build: ./backend
    container_name: mtp-trainer-cpu
    # 仅内网：对外入口统一走 frontend 容器（同源代理 /api）
    volumes:
      - ./data:/app/data
    environment:
      <<: *backend-env
      USE_DATABASE: ${USE_DATABASE:-false}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-model_training}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_COLLATION: ${DB_COLLATION:-utf8mb4_unicode_ci}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-3600}
      DB_ECHO: ${DB_ECHO:-false}
      EMBEDDED_WORKERS: ${EMBEDDED_WORKERS:-0}
      WORKER_REMOTE_REDIS_URL: ${WORKER_REMOTE_REDIS_URL:-}
      WORKER_REMOTE_S3_ENDPOINT: ${WORKER_REMOTE_S3_ENDPOINT:-}
      WORKER_SSH_CREDENTIAL_ENCRYPTION_KEY: ${WORKER_SSH_CREDENTIAL_ENCRYPTION_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    # 前端容器（Node 零依赖静态服务 + /api 反向代理，按语言与后端 Python 分离）
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_BASE: ${NODE_BASE_IMAGE:-node:20-alpine}
    container_name: mtp-frontend-cpu
    ports:
      - "8000:8000"   # 页面与 API 同源入口
    environment:
      API_PROXY_HOST: trainer
      API_PROXY_PORT: 8000
    depends_on:
      - trainer
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:-mtp-worker-cpu:local}
    build: ./backend
    container_name: mtp-worker-cpu
    # 计算平面：supervisor 按 WORKER_CPU_SLOTS 拉起 CPU 执行槽（一卡一进程的 CPU 版）
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 45s
    volumes:
      - ./data:/app/data
    environment:
      <<: *backend-env
      USE_DATABASE: ${USE_DATABASE:-false}
      WORKER_MACHINE_ID: ${WORKER_MACHINE_ID:-}
      WORKER_MANAGED: ${WORKER_MANAGED:-false}
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data-cpu:
  seaweedfs-data-cpu:
